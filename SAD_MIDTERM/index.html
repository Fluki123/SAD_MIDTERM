<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="stud_cal.css">
</head>
<body>

    <!-- Apply the saved theme immediately to avoid a flash of the wrong theme -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                var prefersDark = window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (saved === "dark" || (saved === null && prefersDark)) {
                    document.body.classList.add("dark-mode");
                }
            } catch (e) {}
        })();
    </script>

    <!-- Theme toggle (top right corner) -->
    <button type="button" id="themeToggle" class="theme-toggle"
            aria-label="Switch to dark mode" aria-pressed="false"
            title="Toggle light/dark mode">
        <!-- Moon icon (shown in light mode) -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <!-- Sun icon (shown in dark mode) -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
    </button>

    <div class="calculator-card">
        <h1>Student Grade Calculator</h1>
        <p class="subtitle">Enter the student's grades below.</p>

        <form id="gradeForm" novalidate>
            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName"
                       placeholder="Enter student name">
            </div>

            <div class="form-group">
                <label for="prelim">Prelim Grade</label>
                <input type="number" id="prelim"
                       placeholder="Enter prelim grade"
                       min="0" max="100" step="any">
            </div>

            <div class="form-group">
                <label for="midterm">Midterm Grade</label>
                <input type="number" id="midterm"
                       placeholder="Enter midterm grade"
                       min="0" max="100" step="any">
            </div>

            <div class="form-group">
                <label for="finalGrade">Final Grade</label>
                <input type="number" id="finalGrade"
                       placeholder="Enter final grade"
                       min="0" max="100" step="any">
            </div>

            <div class="button-group">
                <button type="submit" class="calculate-btn">
                    Calculate
                </button>

                <button type="button" id="clearBtn" class="clear-btn">
                    Clear
                </button>
            </div>
        </form>

        <p id="errorMessage" class="error-message"
           role="alert" hidden></p>

        <!-- Results are displayed here after calculation -->
        <section id="results" class="results" hidden>
            <h2>Student Results</h2>

            <div class="result-row">
                <span>Student Name</span>
                <span id="resultName" class="result-value"></span>
            </div>

            <div class="result-row">
                <span>Prelim Grade</span>
                <span id="resultPrelim" class="result-value"></span>
            </div>

            <div class="result-row">
                <span>Midterm Grade</span>
                <span id="resultMidterm" class="result-value"></span>
            </div>

            <div class="result-row">
                <span>Final Grade</span>
                <span id="resultFinal" class="result-value"></span>
            </div>

            <div class="result-row average-row">
                <span>Average Grade</span>
                <span id="resultAverage" class="result-value"></span>
            </div>

            <div class="remarks-box">
                <span>Remarks</span>
                <span id="resultRemarks"></span>
            </div>
        </section>

        <p class="footer-text">Student Grade Calculator System</p>
    </div>

    <script src="stud_cal.js"></script>
</body>
</html>
